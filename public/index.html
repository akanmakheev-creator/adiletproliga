<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Adilet Pro Liga — Школьный футбол</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="APL">
<link rel="apple-touch-icon" href="/images/apl-logo.png">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/images/apl-logo.png">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" id="brandMark"><img src="/images/apl-logo.png" alt="Adilet Pro Liga"></span>
        <span class="brand-text">
          <strong id="brandName">ADILET PRO LIGA</strong>
        </span>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" aria-label="Переключить тему" title="Тема"></button>
        <a href="#/admin" id="adminLink" class="icon-btn admin-link" aria-label="Админ-панель" title="Админ-панель"></a>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav id="bottomnav" aria-label="Основная навигация">
    <a href="#/table" data-tab="table"><span class="bn-ico"></span><span>Таблица</span></a>
    <a href="#/teams" data-tab="teams"><span class="bn-ico"></span><span>Команды</span></a>
    <a href="#/matches" data-tab="matches"><span class="bn-ico"></span><span>Матчи</span></a>
    <a href="#/stats" data-tab="stats"><span class="bn-ico"></span><span>Статистика</span></a>
  </nav>
</div>
<div id="modal-root"></div>
<div id="installBar" hidden></div>
<div id="toast"></div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
<script src="/js/app.js" type="module"></script>
</body>
</html>
